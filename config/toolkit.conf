# toolkit.conf - settings for the Linux Ops Toolkit
# Override any value in config/toolkit.local.conf (not tracked by Git).

# Thresholds (percent)
CPU_WARN=80
MEM_WARN=80
DISK_WARN=80

# Services that must be running
SERVICES=(ssh cron nginx)

# Alerts: minutes to wait before repeating the same alert
ALERT_COOLDOWN_MIN=30

# Optional webhook (set these in config/toolkit.local.conf, never here):
#   ALERT_WEBHOOK_URL="https://..."
#   ALERT_WEBHOOK_FIELD="content"    # Discord: content, Slack: text

# Backups
BACKUP_SOURCES=("$HOME/demo-data" "/etc/nginx")
BACKUP_DIR="$HOME/toolkit-backups"
BACKUP_RETENTION_DAYS=7

# Log report
NGINX_ACCESS_LOG="${NGINX_ACCESS_LOG:-/var/log/nginx/access.log}"
AUTH_LOG="${AUTH_LOG:-/var/log/auth.log}"
TOP_N="${TOP_N:-5}"
# Raise an alert when one IP has at least this many failed SSH logins
FAILED_LOGIN_ALERT="${FAILED_LOGIN_ALERT:-20}"
